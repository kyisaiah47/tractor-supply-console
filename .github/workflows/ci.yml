name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: supply
          POSTGRES_PASSWORD: supply
          POSTGRES_DB: supply
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U supply -d supply"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://supply:supply@localhost:5433/supply
      LLM_PROVIDER: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:setup
      - run: npm test
      - run: npm run build
