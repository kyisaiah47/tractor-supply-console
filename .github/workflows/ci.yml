name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: supply
          POSTGRES_PASSWORD: supply
          POSTGRES_DB: supply
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U supply -d supply"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://supply:supply@localhost:5433/supply
      # No paid model is ever called in CI: the assistant and the brief run offline.
      LLM_PROVIDER: offline
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check supply tests evals
      - run: uv run ruff format --check supply tests evals
      - run: uv run mypy supply tests evals
      # The tests generate and seed their own database at a fixed planning date.
      - run: uv run pytest -q
      # The full setup at today's date, as `npm run db:setup` runs it locally.
      - run: uv run supply setup

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
