[project]
name = "supply"
version = "0.1.0"
description = "Backend for the tractor supply console: API, models, planning assistant and supply order worker"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pandas>=2.2",
  "numpy>=2.1",
  "scipy>=1.14",
  "statsmodels>=0.14.4",
  "scikit-learn>=1.5",
  "httpx>=0.27",
  "anthropic>=0.60",
  "openai>=1.60",
  "python-dotenv>=1.0",
]

[project.scripts]
supply = "supply.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13", "pandas-stubs>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
